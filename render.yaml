services:
  - type: web
    name: nobody-plans
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MODE
        value: hosted
      - key: LLM_PROVIDER
        value: digitalocean
      - key: DO_MODEL
        sync: false
      - key: DO_MODEL_ACCESS_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nobodyplans
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: PUBLIC_URL
        value: https://plan.nikitha.tech
      - key: PROMPT_VERSION
        value: v1
